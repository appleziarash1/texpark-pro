name: Deploy to Pages

# Publishes the repo root to GitHub Pages. The root *is* the site (build.js writes
# index.html, js/, css/, version.txt and TexparkPro.apk there), so the artifact is
# the checkout minus the things that must never be served: the git history, the
# APK signing key, and the build scratch. Uploading the whole tree would publish
# android-keystore.jks, and anyone holding it could sign an APK that Android
# accepts as an update to the owner's installed app.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a queued one finish rather than
# cancelling it - a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the site from source so nothing shipped is stale
        run: node texpark-pro/build.js

      - name: Every path index.html asks for exists, and version.txt agrees
        run: python3 ci/check-site.py

      - name: Stage only what a visitor may have
        run: |
          mkdir -p _site
          for f in index.html version.txt texpark-pro.html sw.js manifest.webmanifest \
                   icon-192.png icon-512.png TexparkPro.apk Code.gs; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -r js css catalog _site/
          rm -f _site/Code.gs   # server-side script, never fetched by the page
          # A signed APK is not a secret, but the key that signs it is. Fail loudly
          # rather than publish it by accident.
          if find _site -name '*.jks' -o -name '*.keystore' | grep -q .; then
            echo "::error::a signing key reached _site - refusing to publish"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # The repository token cannot call the Pages API directly, so the Pages
          # site is turned on here, on the first run, by the workflow token.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
